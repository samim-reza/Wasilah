# Supabase local development configuration.
project_id = "wasilah"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "wasilah://"
# Deep links the auth flow is allowed to redirect back into.
additional_redirect_urls = ["wasilah://auth/callback", "http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[functions.quran-proxy]
# Reading the Quran must not require an account, so no user JWT is demanded.
# The Supabase anon key is still required by the gateway, and the function
# applies its own per-IP rate limit.
verify_jwt = false

[functions.notification-engine]
# Invoked by a scheduled job with the service role key, never by a client.
verify_jwt = true

[functions.daily-ayah]
verify_jwt = false

# Weather is fetched directly from Open-Meteo by the device (no key, coarse
# coordinates only), so it needs no edge function of its own.
