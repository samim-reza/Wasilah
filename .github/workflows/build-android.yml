# Builds the Android APK on a GitHub runner, without using an EAS build slot.
#
# Why this exists: the EAS Free plan allows a fixed number of Android builds a
# month, and a day of rapid iteration exhausts it. `eas build --local` runs
# the exact same pipeline — same prebuild, same config plugins, same keystore
# fetched from EAS — but on this runner, which ships with the JDK and the
# Android SDK already installed. The output is byte-for-byte the kind of APK
# EAS would have produced; only where the Gradle run happens differs.
#
# The APK is attached to a GitHub Release named after the run, which gives a
# plain download URL that works on a phone without signing in to anything.
#
# Manual trigger only. A release per push would be noise; this is for "give
# me the latest APK", run on demand.
#
# Needs three repository secrets: EXPO_TOKEN (to fetch the signing keystore
# from EAS), and the two EXPO_PUBLIC_SUPABASE_* values inlined into the bundle.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: >-
          CPU architectures to include. arm64-v8a alone covers every phone made
          in the last several years at roughly half the size of the full build;
          pick "all" to include 32-bit ARM and the x86 emulator targets too.
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - all

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Generous on purpose. A cold build downloads the NDK and compiles every
    # native module's C++ for the New Architecture; on a two-core runner that
    # alone can pass 40 minutes. The caches below make a warm rerun a fraction
    # of that, but the first build after a dependency change is always cold.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # React Native's Gradle toolchain targets 17; the runner also carries 21,
      # so the version is pinned rather than left to whichever is first on PATH.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # Gradle's dependency and build caches, plus the NDK the build installs
      # into the SDK. Keyed on the lockfile: a dependency change invalidates
      # both, anything else reuses them.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk
          key: android-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            android-build-${{ runner.os }}-

      - run: npm run theme:build

      # The Expo template caps Gradle's JVM at 2 GB heap and 512 MB Metaspace.
      # With this many native modules compiled for the New Architecture that
      # Metaspace ceiling is hit mid-build: the first CI run spent 24 minutes
      # logging `OutOfMemoryError: Metaspace` until the job cap cancelled it.
      # EAS's own machines override the template; a bare runner does not.
      #
      # Set in the user-level gradle.properties, which Gradle ranks above the
      # generated project file — and which prebuild never overwrites. The
      # runner has 7 GB, so 4 GB heap plus 1 GB Metaspace leaves room for the
      # C++ compiles running alongside.
      - name: Give Gradle enough memory
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          PROPS
          # React Native reads this to decide which native ABIs to compile and
          # package. A test APK for a phone does not need x86 emulator code or
          # 32-bit ARM, and dropping them halves the download — which matters
          # when a 135 MB file over a weak connection arrives truncated and
          # Android reports the result as "package appears to be invalid".
          if [ "${{ inputs.abi }}" != "all" ]; then
            echo "reactNativeArchitectures=${{ inputs.abi }}" >> ~/.gradle/gradle.properties
          fi

      - name: Build APK locally with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_APP_ENV: preview
        run: |
          npx eas build --platform android --profile preview \
            --local --non-interactive \
            --output "${{ github.workspace }}/wasilah-preview.apk"

      # A checksum in the release notes is the fastest way to tell a truncated
      # download from a broken build: compare the size and hash of the file on
      # the phone with what is written here.
      - name: Record size and checksum
        id: sum
        run: |
          echo "size=$(stat -c%s wasilah-preview.apk)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum wasilah-preview.apk | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Wasilah preview APK (build ${{ github.run_number }})
          body: |
            Built from `${{ github.sha }}` on the CI runner. Architectures: `${{ inputs.abi }}`.

            Install on Android: download the APK below and open it.

            If Android says the package is invalid, the download was cut short.
            The complete file is exactly **${{ steps.sum.outputs.size }} bytes**;
            SHA-256 `${{ steps.sum.outputs.sha256 }}`.
          files: wasilah-preview.apk
